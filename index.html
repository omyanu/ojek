    <link href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' rel='stylesheet'/>

    <script src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'/>

    <style>
      :root{
      --ink-soft:#4B5670;
      --line:#E3E7EE;
      --surface:#F3F5F8;
      --card:#FFFFFF;
      --accent-ink:#5A3A0E;
      --teal:#159E86;
      --danger:#D3483F;
      --dest:#D3483F;
      --wp:#3E6AE1;
      --radius-lg:20px;
      --radius-md:14px;
      --radius-sm:10px;
      --shadow-sheet:0 -8px 30px rgba(23,34,59,0.14);
      --shadow-card:0 2px 10px rgba(23,34,59,0.08);
      --shadow-compact:0 -4px 20px rgba(23,34,59,0.15);
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
      html,body{height:100dvh;margin:0;overscroll-behavior:none;}
      body{
      font-family:&#39;Manrope&#39;,system-ui,sans-serif;
      color:var(--ink);
      background:var(--surface);
      position:fixed;inset:0;
      overflow:hidden;
      }
      .mono{font-family:&#39;IBM Plex Mono&#39;,monospace;}
      button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
      input{font-family:inherit;}

      /* ---------- MAP ---------- */
      #map{position:absolute;inset:0;z-index:1;background:#DCE3EA;}
      .leaflet-control-attribution{font-size:9px;opacity:.6;}

      .crosshair-pin{
      position:absolute;left:50%;top:50%;
      transform:translate(-50%,-100%);
      z-index:5;pointer-events:none;
      display:none;flex-direction:column;align-items:center;
      filter:drop-shadow(0 3px 4px rgba(23,34,59,.35));
      }
      .crosshair-pin.show{display:flex;}
      .crosshair-pin svg{width:38px;height:38px;}
      .crosshair-pin .dot{width:6px;height:6px;border-radius:50%;background:rgba(23,34,59,.45);margin-top:-4px;}

      /* ---------- TOP BAR ---------- */
      .topbar{
      position:absolute;top:0;left:0;right:0;z-index:20;
      padding:14px 14px 0;
      display:flex;justify-content:space-between;align-items:flex-start;
      pointer-events:none;
      }
      .topbar-right { display:flex; gap:10px; }
      .icon-btn{
      width:42px;height:42px;border-radius:50%;
      background:var(--card);box-shadow:var(--shadow-card);
      display:flex;align-items:center;justify-content:center;
      pointer-events:auto;color:var(--ink);flex:none;
      }
      .icon-btn svg{width:20px;height:20px;}
      .icon-btn:active{transform:scale(.94);}
      .icon-btn.ghost{background:rgba(255,255,255,.92);}

      /* ---------- TOP SETTINGS (COLLAPSIBLE) ---------- */
      .top-menu{
      position:absolute; top:0; left:0; right:0; z-index:25;
      background:var(--card); box-shadow:var(--shadow-sheet);
      border-radius:0 0 var(--radius-lg) var(--radius-lg);
      padding:20px 18px; transform:translateY(-110%);
      transition:transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 85vh; overflow-y: auto; 
      }
      .top-menu.show { transform:translateY(0); }
      .top-menu-title { font-weight:800; font-size:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
      .settings-row{
      display:flex;align-items:center;justify-content:space-between;
      margin-top:8px;padding:12px 14px;background:var(--surface);border-radius:var(--radius-md);
      }
      .settings-row .label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft);}
      .price-edit{display:flex;align-items:center;gap:6px;}
      .price-edit input{
      width:70px;text-align:right;border:none;background:transparent;
      font-size:14px;font-weight:700;color:var(--ink);
      }
      .price-edit input:focus{outline:none;}
      .price-edit .unit{font-size:12px;color:var(--ink-soft);font-weight:600;}

      /* Toggle Switch */
      .toggle-switch { position:relative; width:42px; height:24px; }
      .toggle-switch input { opacity:0; width:0; height:0; }
      .toggle-slider {
      position:absolute; cursor:pointer; inset:0;
      background-color:var(--line); border-radius:24px; transition:.3s;
      }
      .toggle-slider:before {
      position:absolute; content:&quot;&quot;; height:18px; width:18px;
      left:3px; bottom:3px; background-color:white;
      border-radius:50%; transition:.3s;
      }
      .toggle-switch input:checked + .toggle-slider { background-color:var(--teal); }
      .toggle-switch input:checked + .toggle-slider:before { transform:translateX(18px); }

      /* ---------- SERVICE SCHEDULE ---------- */
      .service-schedule-card{
      margin:2px 0 14px;padding:13px 14px;
      border:1px solid var(--line);border-radius:var(--radius-md);
      background:linear-gradient(135deg,#FFFFFF 0%,#F7F9FC 100%);
      box-shadow:0 2px 8px rgba(23,34,59,.05);
      }
      .schedule-summary{display:flex;align-items:center;gap:11px;}
      .schedule-icon{
      width:38px;height:38px;border-radius:12px;background:#E8F6F2;color:var(--teal);
      display:flex;align-items:center;justify-content:center;flex:none;
      }
      .schedule-icon svg{width:19px;height:19px;}
      .schedule-main{flex:1;min-width:0;}
      .schedule-label{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.45px;}
      .schedule-today{font-size:13.5px;font-weight:800;margin-top:2px;line-height:1.35;}
      .schedule-badge{
      font-size:10.5px;font-weight:800;padding:6px 9px;border-radius:20px;
      background:#E8F6F2;color:#117864;white-space:nowrap;
      }
      .schedule-badge.closed{background:#FCEBE9;color:var(--danger);}
      .schedule-toggle{
      width:100%;display:flex;align-items:center;justify-content:center;gap:5px;
      padding:8px 0 0;margin-top:9px;border-top:1px dashed var(--line);
      color:var(--ink-soft);font-size:11.5px;font-weight:800;
      }
      .schedule-toggle svg{width:14px;height:14px;transition:transform .2s;}
      .service-schedule-card.expanded .schedule-toggle svg{transform:rotate(180deg);}
      .schedule-list{display:none;margin-top:9px;padding-top:3px;}
      .service-schedule-card.expanded .schedule-list{display:block;}
      .schedule-day{
      display:flex;justify-content:space-between;gap:12px;padding:7px 2px;
      border-bottom:1px solid var(--line);font-size:12px;
      }
      .schedule-day:last-child{border-bottom:none;}
      .schedule-day span:first-child{font-weight:700;color:var(--ink-soft);}
      .schedule-day b{font-weight:800;text-align:right;}
      .schedule-day.today span:first-child,.schedule-day.today b{color:var(--teal);}
      .schedule-day .holiday{color:var(--danger);}

      /* ---------- SERVICE CHOICE ---------- */
      .service-selector{margin-top:14px;}
      .service-selector-title{
      font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;
      letter-spacing:.4px;margin-bottom:8px;
      }
      .service-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
      .service-option{
      min-width:0;padding:11px 6px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
      background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:6px;color:var(--ink-soft);font-size:11px;font-weight:800;line-height:1.2;
      }
      .service-option svg{width:20px;height:20px;}
      .service-option.active{
      border-color:var(--teal);background:#EAF8F5;color:#117864;
      box-shadow:0 2px 8px rgba(21,158,134,.12);
      }
      .service-option:active{transform:scale(.97);}

      /* ---------- BOTTOM SHEET ---------- */
      .sheet{
      position:absolute;left:0;right:0;bottom:0;z-index:20;
      background:var(--card);
      border-radius:22px 22px 0 0;
      box-shadow:var(--shadow-sheet);
      max-height:88vh;
      display:flex;flex-direction:column;
      transition:transform .28s cubic-bezier(.32,.72,0,1), opacity 0.2s;
      }
      .sheet.minimized {
      transform: translateY(120%);
      opacity: 0;
      pointer-events: none;
      }
      .sheet-handle{width:100%;padding:10px 0 6px;display:flex;justify-content:center;flex:none;}
      .sheet-handle span{
      width:38px;height:4px;border-radius:3px;background:var(--line);
      position:relative;
      }
      .sheet-body{padding:2px 18px 22px;overflow-y:auto;}
      .sheet-title{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:2px 0 14px;display:flex;align-items:center;justify-content:space-between;}
      .btn-minimize { color:var(--ink-soft); display:flex; align-items:center; justify-content:center; padding:4px;}

      /* ---------- COMPACT BOTTOM BAR ---------- */
      .compact-bar{
      position:absolute; left:0; right:0; bottom:0; z-index:15;
      background:var(--ink); color:#fff;
      border-radius:22px 22px 0 0; box-shadow:var(--shadow-compact);
      padding:16px 20px 24px;
      display:flex; align-items:center; justify-content:space-between;
      transform:translateY(120%); transition:transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      pointer-events:auto;
      }
      .compact-bar.show { transform:translateY(0); }
      .cb-info { display:flex; flex-direction:column; gap:2px; flex:1; cursor:pointer;}
      .cb-price { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
      .cb-dist { font-size:12.5px; font-weight:600; color:rgba(255,255,255,0.7); }
      .cb-actions { display:flex; gap:10px; align-items:center;}
      .cb-btn {
      width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.15);
      display:flex; align-items:center; justify-content:center; color:#fff;
      }
      .cb-btn:active { background:rgba(255,255,255,0.25); }

      /* route stack */
      .route-stack{position:relative;padding-left:26px;}
      .route-rail{
      position:absolute;left:9px;top:14px;bottom:14px;width:2px;
      background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px);
      }
      .route-row{
      position:relative;display:flex;align-items:center;gap:10px;
      padding:9px 0;
      }
      .route-dot{
      position:absolute;left:-26px;top:50%;transform:translateY(-50%);
      width:20px;height:20px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;flex:none;
      background:var(--card);
      }
      .route-dot svg{width:14px;height:14px;}
      .route-dot.origin{color:var(--origin);}
      .route-dot.dest{color:var(--dest);}
      .route-dot.waypoint{color:var(--wp);}

      .route-field{
      flex:1;min-width:0;
      background:var(--surface);border-radius:var(--radius-sm);
      padding:11px 12px;display:flex;align-items:center;gap:8px;
      min-height:44px;
      }
      .route-field.empty .field-text{color:var(--ink-soft);font-weight:600;}
      .field-text{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .field-clear{width:22px;height:22px;flex:none;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
      .field-clear svg{width:14px;height:14px;}

      .swap-btn{
      position:absolute; right:0; top:43px; width:34px; height:34px;
      border-radius:50%; background:var(--card); border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06); z-index:10; cursor:pointer;
      }
      .swap-btn:active { transform:scale(0.9); }

      .add-stop-btn{
      display:flex;align-items:center;gap:8px;
      padding:9px 2px;font-size:13px;font-weight:700;color:var(--wp);
      }
      .add-stop-btn svg{width:17px;height:17px;}

      /* CTA */
      .cta{
      margin-top:16px;width:100%;padding:15px;border-radius:var(--radius-md);
      background:var(--ink);color:#fff;font-weight:800;font-size:15px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      transition:opacity .15s, transform .1s;
      }
      .cta[disabled]{opacity:.35;pointer-events:none;}
      .cta:active{transform:scale(.98);}
      .cta svg{width:18px;height:18px;}
      .cta.loading svg{animation:spin .8s linear infinite;}
      @keyframes spin{to{transform:rotate(360deg);}}

      .nav-btn {
      margin-top:14px;width:100%;padding:13px;border-radius:var(--radius-md);
      background:#4285F4;color:#fff;font-weight:800;font-size:14px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      }
      .nav-btn svg { width:18px;height:18px; }

      /* ---------- RESULT VIEW ---------- */
      .result{display:none;}
      .result.show{display:block;}
      .result-actions-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
      .result-back{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-soft);}
      .result-back svg{width:16px;height:16px;}

      .meter-card{
      background:linear-gradient(155deg,var(--ink) 0%, #223052 100%);
      border-radius:var(--radius-lg);padding:20px 20px 18px;color:#fff;margin-bottom:16px;
      position:relative;overflow:hidden;
      }
      .meter-card::after{
      content:&#39;&#39;;position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;
      background:radial-gradient(circle,rgba(217,140,43,.35),transparent 70%);
      }
      .meter-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);}
      .meter-value{font-size:34px;font-weight:700;margin-top:4px;letter-spacing:-.5px;position:relative;z-index:1;}
      .meter-value .curr{font-size:18px;vertical-align:2px;color:var(--accent);margin-right:2px;}
      .meter-sub{display:flex;gap:16px;margin-top:12px;position:relative;z-index:1;}
      .meter-sub div{font-size:12px;color:rgba(255,255,255,.65);}
      .meter-sub b{display:block;font-size:15px;color:#fff;font-weight:700;margin-top:1px;}

      .ruler{margin-top:16px;position:relative;z-index:1;}
      .ruler-track{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;}
      .ruler-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:4px;transition:width .9s cubic-bezier(.16,1,.3,1);}
      .ruler-ticks{display:flex;justify-content:space-between;margin-top:5px;}
      .ruler-ticks span{font-size:9px;color:rgba(255,255,255,.4);font-weight:600;}

      .segment-list{margin-top:2px;}
      .segment-title{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 8px;}
      .segment{
      display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
      }
      .segment:last-child{border-bottom:none;}
      .segment-icon{width:26px;height:26px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-soft);}
      .segment-icon svg{width:13px;height:13px;}
      .segment-text{flex:1;min-width:0;}
      .segment-route{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .segment-dist{font-size:11px;color:var(--ink-soft);margin-top:1px;}
      .segment-fare{font-size:12.5px;font-weight:700;flex:none;}

      .action-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;}
      .btn-full { grid-column: span 2; }
      .recalc-btn{
      width:100%;padding:13px;border-radius:var(--radius-md);
      background:var(--surface);color:var(--ink);font-weight:800;font-size:14px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      }
      .share-btn {
      width:100%;padding:13px;border-radius:var(--radius-md);
      background:var(--accent);color:#fff;font-weight:800;font-size:14px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      }
      .share-btn svg, .recalc-btn svg{width:16px;height:16px;}

      /* ---------- MODAL PAYMENT ---------- */
      .modal-overlay {
      position: fixed; inset: 0; background: rgba(23,34,59,0.6); z-index: 100;
      display: none; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; transition: opacity 0.2s;
      }
      .modal-overlay.show { display: flex; opacity: 1; }
      .modal-card {
      background: var(--card); border-radius: var(--radius-lg);
      width: 100%; max-width: 340px; padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2); transform: translateY(20px); transition: transform 0.2s;
      }
      .modal-overlay.show .modal-card { transform: translateY(0); }
      .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center;}

      .pay-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px; background: var(--surface); border-radius: var(--radius-sm); margin-bottom: 8px;
      }
      .pay-item:last-child { margin-bottom: 0; }
      .pay-item-info { display: flex; flex-direction: column; }
      .pay-bank { font-size: 11px; color: var(--ink-soft); font-weight: 700; text-transform: uppercase; margin-bottom: 2px;}
      .pay-acc { font-size: 15px; font-weight: 800; font-family: &#39;IBM Plex Mono&#39;, monospace; color: var(--ink); }
      .btn-copy {
      width: 36px; height: 36px; border-radius: 50%; background: var(--card); color: var(--teal);
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card);
      }
      .btn-copy:active { transform: scale(0.92); }

      /* ---------- SEARCH PANEL ---------- */
      .search-panel{
      position:fixed;inset:0;z-index:50;background:var(--card);
      display:flex;flex-direction:column;
      transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
      }
      .search-panel.show{transform:translateY(0);}
      .search-head{
      display:flex;align-items:center;gap:10px;padding:14px 14px 10px;flex:none;
      border-bottom:1px solid var(--line);
      }
      .search-input-wrap{
      flex:1;background:var(--surface);border-radius:var(--radius-sm);
      display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;
      }
      .search-input-wrap svg{width:16px;height:16px;color:var(--ink-soft);flex:none;}
      .search-input-wrap input{
      flex:1;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--ink);height:100%;
      }
      .search-input-wrap input:focus{outline:none;}
      .search-input-wrap .clear-x{display:none;color:var(--ink-soft);}
      .search-input-wrap .clear-x svg{width:14px;height:14px;}

      .search-body{flex:1;overflow-y:auto;padding:6px 6px 20px;}
      .quick-actions{padding:6px 8px 4px;}
      .quick-action{
      display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:var(--radius-sm);
      }
      .quick-action:active{background:var(--surface);}
      .quick-action .qa-icon{
      width:36px;height:36px;border-radius:50%;background:var(--surface);
      display:flex;align-items:center;justify-content:center;flex:none;color:var(--teal);
      }
      .quick-action .qa-icon svg{width:18px;height:18px;}
      .quick-action .qa-text b{display:block;font-size:13.5px;font-weight:700;}
      .quick-action .qa-text span{font-size:11.5px;color:var(--ink-soft);}

      .result-list{padding:4px 8px;}
      .result-item{
      display:flex;align-items:flex-start;gap:12px;padding:11px 8px;border-radius:var(--radius-sm);
      }
      .result-item:active{background:var(--surface);}
      .result-item .ri-icon{width:30px;height:30px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-soft);margin-top:1px;}
      .result-item .ri-icon svg{width:14px;height:14px;}
      .result-item .ri-text b{display:block;font-size:13.5px;font-weight:700;line-height:1.35;}
      .result-item .ri-text span{font-size:11.5px;color:var(--ink-soft);line-height:1.4;display:block;margin-top:1px;}
      .search-empty{padding:30px 20px;text-align:center;color:var(--ink-soft);font-size:12.5px;}

      /* map-pick mode */
      .pick-bar{
      position:fixed;left:0;right:0;bottom:0;z-index:60;
      background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow-sheet);
      padding:16px 18px 22px;display:none;
      }
      .pick-bar.show{display:block;}
      .pick-address{font-size:13.5px;font-weight:700;margin-bottom:2px;line-height:1.4;min-height:19px;}
      .pick-sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}
      .pick-confirm{
      width:100%;padding:14px;border-radius:var(--radius-md);background:var(--ink);color:#fff;
      font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;
      }
      .pick-confirm svg{width:16px;height:16px;}
      .pick-cancel{
      width:100%;padding:10px;margin-top:6px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink-soft);
      }

      /* toast */
      .toast{
      position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);z-index:80;
      background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;
      padding:10px 16px;border-radius:30px;box-shadow:var(--shadow-fab);
      transition:transform .25s cubic-bezier(.32,.72,0,1);white-space:nowrap;
      }
      .toast.show{transform:translate(-50%,0);}

      /* leaflet marker label badges */
      .pt-badge{
      width:26px;height:34px;position:relative;
      }
      .pt-badge svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(23,34,59,.35));}
      .pt-badge .num{
      position:absolute;top:5px;left:0;right:0;text-align:center;
      font-family:&#39;IBM Plex Mono&#39;,monospace;font-size:10px;font-weight:700;color:#fff;
      }
    </style>
